name: Package and verify editors
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.3.0'
          cache: npm
          cache-dependency-path: tooling/vscode/package-lock.json
      - name: Build shared language server and dependencies
        run: ./mvnw -B -ntp -pl jx-language-server -am package
      - name: Package VS Code extension
        working-directory: tooling/vscode
        run: |
          npm ci
          npm run package
      - name: Test and verify IntelliJ plugin against pinned IDEA
        working-directory: tooling/intellij
        run: ./gradlew --no-daemon test buildPlugin verifyPlugin
      - name: Check bundled compiler, language server and Java bridge identity
        run: java tooling/vscode/VerifyPackages.java
      - uses: actions/upload-artifact@v4
        with:
          name: jx-editor-packages
          if-no-files-found: error
          path: |
            tooling/vscode/jx-language-0.2.0.vsix
            tooling/intellij/build/distributions/jx-intellij-0.3.2.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-verification-reports
          if-no-files-found: warn
          path: |
            tooling/intellij/build/reports/tests/
            tooling/intellij/build/reports/pluginVerifier/
            tooling/intellij/build/reports/editor-scale/
