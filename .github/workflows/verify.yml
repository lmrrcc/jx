name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: java tools/CheckAgentSetup.java
      - run: ./mvnw -B -ntp -Dmaven.repo.local=.cache/maven-repository package
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - run: npm run build:proof
      - run: npm run test:proof
