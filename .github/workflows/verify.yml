name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: java tools/CheckAgentSetup.java
      - run: java tools/CheckBaseline.java
      - run: java tools/PrePush.java --check
      - run: npm ci
      - run: java tools/GenerateDomTables.java --check
      - run: ./mvnw -B -ntp -Dmaven.repo.local=.cache/maven-repository install
      - run: npx playwright install --with-deps chrome
      - run: npm run build:proof
      - run: npm run test:proof
      - run: npm run build:runtime
      - run: npm run test:runtime
      - run: npm run test:bench
      - run: npm run test:lazy
      - run: npm run test:rsc
      - run: npm run test:counter
      - run: java tools/VerifyComponentLibrary.java .cache/maven-repository
      - run: npm run test:todo
      - run: npm run test:packaged
      - run: npm run test:auth
      - run: npm run test:ssr-protected
      - run: npm run test:hot
      - run: npm run test:extension
      - run: npm run test:consumer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-consumer-evidence
          if-no-files-found: ignore
          path: |
            target/artifact-consumer-proof.txt
            target/artifact-consumer-reports/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          if-no-files-found: ignore
          path: |
            test-results/
            **/test-results/
            !**/node_modules/**
